<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Dashboard</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171e26; --line: #26303b; --text: #d8dee6; --dim: #7d8a99;
    --ok: #3ddc84; --off: #6b7785; --accent: #4db3ff; --warn: #ffb454;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6f8; --panel: #fff; --line: #dde3ea; --text: #1c2530; --dim: #66748a;
            --ok: #12a150; --off: #8a96a5; --accent: #0a6cc4; --warn: #b26a00; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .pane { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .pane + .pane { margin-top: 12px; }
  .scroll { flex: 1; min-height: 0; overflow: auto; background: var(--panel);
            border: 1px solid var(--line); border-radius: 8px; }
  .scroll thead th { position: sticky; top: 0; background: var(--panel); box-shadow: 0 1px 0 var(--line); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  .stat { color: var(--dim); }
  .stat b { color: var(--text); }
  .spacer { flex: 1; }
  label { color: var(--dim); cursor: pointer; user-select: none; }
  #err { background: #4a1d1d; color: #ffb4b4; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--off); }
  .running .dot { background: var(--ok); }
  .stopped { opacity: .55; }
  .name { font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; }
  .port { display: inline-block; margin: 0 6px 4px 0; padding: 1px 8px; border-radius: 10px;
          border: 1px solid var(--line); white-space: nowrap; }
  a.port { color: var(--accent); border-color: var(--accent); text-decoration: none; }
  a.port:hover { background: var(--accent); color: var(--bg); }
  .port.internal { color: var(--dim); }
  .none { color: var(--dim); }
  .acts { white-space: nowrap; }
  button { font: inherit; font-size: 12px; color: var(--text); background: transparent; cursor: pointer;
           border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; margin-right: 4px; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.stop:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  button:disabled { opacity: .5; cursor: wait; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .net { color: var(--warn); font-size: 12px; }
  @media (max-width: 700px) { th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Docker Dashboard</h1>
  <span class="stat"><b id="nrun">0</b> running</span>
  <span class="stat"><b id="npub">0</b> published ports</span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="showall"> show stopped</label>
  <span class="stat" id="upd">…</span>
</header>
<div id="err"></div>
<section class="pane">
<div class="scroll">
<table>
  <thead><tr><th>Container</th><th>Image</th><th>Status</th><th>Ports</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
</section>
<section class="pane">
<h2>Other listening ports <span class="stat" id="nother"></span></h2>
<div class="scroll">
<table>
  <thead><tr><th>Port</th><th>Process</th><th>Reachable from</th><th></th></tr></thead>
  <tbody id="other"></tbody>
</table>
</div>
</section>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let data = [];
let listeners = [];
let busy = false;  // an action is in flight; don't let the poll redraw the buttons

try { $('showall').checked = localStorage.getItem('showall') === '1'; } catch {}
$('showall').onchange = () => {
  try { localStorage.setItem('showall', $('showall').checked ? '1' : '0'); } catch {}
  render();
};

function portHtml(p) {
  if (!p.published) return `<span class="port internal" title="not published to the host">${esc(p.container)}/${esc(p.proto)}</span>`;
  const label = `:${esc(p.host)} → ${esc(p.container)}/${esc(p.proto)}`;
  if (p.proto === 'tcp' && !p.host.includes('-'))
    return `<a class="port" href="http://localhost:${esc(p.host)}" target="_blank" rel="noopener">${label}</a>`;
  return `<span class="port">${label}</span>`;
}

function render() {
  const all = $('showall').checked;
  const shown = data.filter(c => all || c.state === 'running');
  $('nrun').textContent = data.filter(c => c.state === 'running').length;
  $('npub').textContent = data.filter(c => c.state === 'running')
    .reduce((n, c) => n + c.ports.filter(p => p.published).length, 0);
  $('rows').innerHTML = shown.length ? shown.map(c => `
    <tr class="${c.state === 'running' ? 'running' : 'stopped'}">
      <td><span class="dot"></span><span class="name">${esc(c.name)}</span><div class="sub">${esc(c.id)}</div></td>
      <td>${esc(c.image)}</td>
      <td>${esc(c.status)}</td>
      <td>${c.ports.length ? c.ports.map(portHtml).join('') : '<span class="none">none</span>'}</td>
      <td class="acts">${c.state === 'running'
        ? `<button class="stop" data-act="stop" data-id="${esc(c.id)}">stop</button><button data-act="restart" data-id="${esc(c.id)}">restart</button>`
        : `<button data-act="start" data-id="${esc(c.id)}">start</button>`}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="none">No containers.</td></tr>';
}

function renderOther() {
  // Docker's published ports are already in the table above; skip them here.
  const dockerPorts = new Set(data.filter(c => c.state === 'running')
    .flatMap(c => c.ports.filter(p => p.published).map(p => p.host)));
  const rows = listeners.filter(l => !dockerPorts.has(String(l.port)));
  $('nother').textContent = `(${rows.length})`;
  $('other').innerHTML = rows.length ? rows.map(l => `
    <tr>
      <td>:${l.port}</td>
      <td>${esc(l.process)} <span class="sub">pid ${esc(l.pid)}</span></td>
      <td>${l.local ? 'this Mac only' : '<span class="net">all interfaces</span>'}</td>
      <td class="acts"><a class="port" href="http://localhost:${l.port}" target="_blank" rel="noopener">open</a></td>
    </tr>`).join('') : '<tr><td colspan="4" class="none">Nothing else listening.</td></tr>';
}

async function refreshPorts() {
  try {
    const r = await (await fetch('/api/ports', {cache: 'no-store'})).json();
    if (r.ok) { listeners = r.ports; renderOther(); }
  } catch {}
}

$('rows').onclick = async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  busy = true;
  b.closest('td').querySelectorAll('button').forEach(x => x.disabled = true);
  try {
    const r = await (await fetch(`/api/containers/${b.dataset.id}/${b.dataset.act}`,
      {method: 'POST', headers: {'X-Dashboard': '1'}})).json();
    $('err').style.display = r.ok ? 'none' : 'block';
    if (!r.ok) $('err').textContent = `${b.dataset.act} failed: ${r.error}`;
  } catch (err) {
    $('err').style.display = 'block';
    $('err').textContent = 'Dashboard server not reachable: ' + err;
  }
  busy = false;
  refresh();
};

async function refresh() {
  if (busy) return;
  try {
    const r = await (await fetch('/api/containers', {cache: 'no-store'})).json();
    $('err').style.display = r.ok ? 'none' : 'block';
    if (!r.ok) $('err').textContent = 'Docker not reachable: ' + r.error;
    else { data = r.containers; render(); }
    refreshPorts();
    $('upd').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('err').style.display = 'block';
    $('err').textContent = 'Dashboard server not reachable: ' + e;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
